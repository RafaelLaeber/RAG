[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agente RAG com memória usando LangChain, LangSmith, OpenAI e Astra DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langchain-astradb>=1.0",
    "langchain-text-splitters>=1.1",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "httpx>=0.28",
    "pydantic-settings>=2.16",
    "pypdf>=6.0",
    "pyyaml>=6.0",
]


[project.optional-dependencies]
dev = [
    "ruff>=0.17",
    "mypy>=2.4",
    "types-PyYAML>=6.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

