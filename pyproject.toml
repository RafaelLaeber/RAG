[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "RAG agêntico com LangChain, LangGraph, OpenAI e Astra DB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4",
    "langchain-openai>=1.7",
    "langchain-astradb>=1.0",
    "langgraph>=1.2",
    "pydantic-settings>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.17",
    "mypy>=2.4",
    "ipykernel>=7.4",
]


[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: testes que chamam APIs externas (custam dinheiro)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

